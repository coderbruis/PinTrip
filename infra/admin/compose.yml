services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pintrip_admin
      MYSQL_USER: pintrip
      MYSQL_PASSWORD: pintrip
      MYSQL_ROOT_PASSWORD: pintrip-root
    ports:
      - "3306:3306"
    volumes:
      - pintrip-admin-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-upintrip", "-ppintrip"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pintrip-admin-mysql:
